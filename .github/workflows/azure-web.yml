# Deploys the Next.js front end (frontend/) to an Azure Web App running Node.
#
# One-time Azure setup:
#   1. A Linux Web App with runtime "Node 22 LTS". The existing
#      rapid-door-estimator app can be switched from Python to Node and
#      reused — it already has the VNet integration and the Entra sign-in,
#      which are the fiddly parts to recreate.
#   2. Configuration > General settings > Startup Command:  sh startup.sh
#      That script forces HOSTNAME=0.0.0.0. Without it the standalone server
#      binds to the machine name App Service supplies and listens on nothing
#      reachable — so no HOSTNAME app setting is needed.
#   3. Configuration > Application settings:
#        API_URL   = https://<your-api-app>.azurewebsites.net
#   4. No secret to create: authentication reuses the OIDC federated identity
#      Deployment Center set up for this repository (the AZUREAPPSERVICE_*
#      secrets). That also avoids publish profiles, which depend on SCM basic
#      authentication being enabled and that is off by default on newer apps.
name: Deploy web to Azure

on:
  push:
    # ci/** runs the tests on a branch without deploying, so a red run costs
    # nothing. The deploy job is pinned to refs/heads/main below.
    branches: [main, "ci/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/azure-web.yml"
  # Pull requests run the tests but never reach the deploy job, so a branch can
  # be checked before it is merged. This is also what branch protection needs
  # something to require.
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/azure-web.yml"
  workflow_dispatch:
    inputs:
      app_name:
        description: "Azure Web App to deploy to"
        required: true
        default: rapid-door-estimator

env:
  # Run it by hand and you pick the app; a push to main uses the default.
  AZURE_WEBAPP_NAME: ${{ github.event.inputs.app_name || 'rapid-door-estimator' }}
  # Match the Web App's runtime stack. The standalone bundle has no
  # native modules, so a mismatch is survivable — but building and
  # running on the same major removes a class of subtle differences.
  NODE_VERSION: "22.x"

jobs:
  # Gate the deploy on the end-to-end suite.
  #
  # Its own job rather than extra steps on the deploy job, for two reasons: a
  # pull request can run it without being granted any Azure permission at all,
  # and Playwright starts the app itself through the webServer block in
  # playwright.config.ts, which is the path that is already known to work.
  #
  # No database and no M1 here. The suite is built for that — the specs stub
  # the API routes they need, and the handful that genuinely require the Python
  # API call test.skip() rather than failing. Verified locally against a server
  # pointed at an unreachable API: 56 passed, 6 skipped, 0 failed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install the browser
        working-directory: frontend
        # Both projects in the config — desktop Chrome and a Pixel 7 — run on
        # the same chromium build, so one download covers the whole suite.
        run: npx playwright install --with-deps chromium

      # TEMPORARY (ci/e2e-gate): the "@/..." alias resolves on Windows and not
      # on the runner. This replays Playwright's own resolver so the answer
      # comes from the runner rather than from guesswork. Delete before merge.
      - name: Diagnose the path alias
        working-directory: frontend
        run: |
          echo "cwd=$(pwd)"
          echo "--- does the target exist ---"
          ls -la src/types/door.ts src/components/ui/button.tsx || true
          echo "--- tsconfig as the runner sees it ---"
          cat tsconfig.json
          echo "--- replay of playwright resolveHook ---"
          node -e '
            const fs=require("fs"), path=require("path");
            const cfg=path.resolve("tsconfig.json");
            console.log("tsconfig:", cfg, fs.existsSync(cfg));
            const c=JSON.parse(fs.readFileSync(cfg,"utf8"));
            const mapping=c.compilerOptions&&c.compilerOptions.paths;
            console.log("paths mapping:", JSON.stringify(mapping));
            console.log("baseUrl:", c.compilerOptions&&c.compilerOptions.baseUrl);
            const pathsBase=path.dirname(cfg);
            for (const spec of ["@/types/door","@/components/ui/button"]) {
              const rest=spec.slice(2);
              for (const v of (mapping&&mapping["@/*"])||[]) {
                const cand=path.resolve(pathsBase, v.replace("*", rest));
                const hits=["",".ts",".tsx",".js",".jsx"]
                  .filter(e=>{const s=fs.statSync(cand+e,{throwIfNoEntry:false});return s&&s.isFile();});
                console.log(spec, "->", cand, "| resolves as:", hits.join(",")||"NOTHING");
              }
            }
          '
          echo "--- playwright version actually installed ---"
          node -e 'console.log(require("@playwright/test/package.json").version)'

      - name: Run the end-to-end tests
        working-directory: frontend
        env:
          # Deliberately unset: with no API_URL the BFF routes answer 503 and
          # the API-dependent specs skip themselves. Pointing this at a real
          # API would make the suite depend on a VNet the runner has no access
          # to, and would run assertions against live pricing configuration.
          CI: "true"
        # --tsconfig is not optional here. By default Playwright looks up a
        # tsconfig per imported file by walking up from that file's folder,
        # and on the runner that walk did not find frontend/tsconfig.json for
        # files under src/ -- so the "@/..." path alias stopped resolving and
        # eighteen tests died on "Cannot find module '@/types/door'" while
        # passing on Windows. Naming one tsconfig for every imported file
        # removes the lookup, and with it the difference between the two
        # machines.
        run: npx playwright test --tsconfig=tsconfig.json

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  build-and-deploy:
    # A failing test stops the deploy, and only main ever deploys — a pull
    # request or a ci/** branch runs the tests and stops there.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # OIDC: azure/login exchanges a short-lived GitHub token for an Azure one,
    # so there is no client secret stored anywhere. id-token: write is what
    # lets the runner request that token.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint and type-check
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Build
        working-directory: frontend
        # API_URL is read at request time by the BFF routes, not baked in at
        # build time, so it does not need to be present here.
        run: npm run build

      - name: Assemble the standalone bundle
        # `output: standalone` emits server.js plus the traced node_modules,
        # but static assets and public/ are deliberately left out of it.
        working-directory: frontend
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # The startup command runs from the deployed root, so the script has
          # to be inside the bundle rather than alongside it in the repo.
          cp startup.sh .next/standalone/startup.sh
          chmod +x .next/standalone/startup.sh
          # Next copies .env into the standalone output. CI never checks one
          # out, but strip it anyway so the same commands are safe to run by
          # hand on a machine that does have real credentials in frontend/.env.
          rm -f .next/standalone/.env .next/standalone/.env.*

      - name: Fail if a secret made it into the bundle
        working-directory: frontend
        run: |
          if find .next/standalone -maxdepth 1 -name '.env*' | grep -q .; then
            echo "An .env file is in the deploy bundle — refusing to publish."
            exit 1
          fi
          echo "no .env in the bundle"

      - name: Check the Azure credentials are present
        run: |
          if [ -z "${{ secrets.AZUREAPPSERVICE_CLIENTID_BA3CC3A78F13426BB5AB97009A81433D }}" ]; then
            echo "::error::The AZUREAPPSERVICE_CLIENTID_... secret is missing."
            echo "These three secrets come from Azure Deployment Center and are"
            echo "already used by this repository. Check they still exist under"
            echo "Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Azure federated credentials are present"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA3CC3A78F13426BB5AB97009A81433D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_527ED56A30554F39BDCCDDB327FDA5A2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8010676516614B76ABB4A1684989F293 }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: frontend/.next/standalone
