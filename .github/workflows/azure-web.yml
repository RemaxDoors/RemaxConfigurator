# Deploys the Next.js front end (frontend/) to an Azure Web App running Node.
#
# One-time Azure setup:
#   1. A Linux Web App with runtime "Node 22 LTS". The existing
#      rapid-door-estimator app can be switched from Python to Node and
#      reused — it already has the VNet integration and the Entra sign-in,
#      which are the fiddly parts to recreate.
#   2. Configuration > General settings > Startup Command:  sh startup.sh
#      That script forces HOSTNAME=0.0.0.0. Without it the standalone server
#      binds to the machine name App Service supplies and listens on nothing
#      reachable — so no HOSTNAME app setting is needed.
#   3. Configuration > Application settings:
#        API_URL   = https://<your-api-app>.azurewebsites.net
#   4. Set the AZURE_WEBAPP_PUBLISH_PROFILE secret (Get publish profile).
name: Deploy web to Azure

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/azure-web.yml"
  workflow_dispatch:
    inputs:
      app_name:
        description: "Azure Web App to deploy to"
        required: true
        default: rapid-door-estimator

env:
  # Run it by hand and you pick the app; a push to main uses the default.
  AZURE_WEBAPP_NAME: ${{ github.event.inputs.app_name || 'rapid-door-estimator' }}
  # Match the Web App's runtime stack. The standalone bundle has no
  # native modules, so a mismatch is survivable — but building and
  # running on the same major removes a class of subtle differences.
  NODE_VERSION: "22.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint and type-check
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Build
        working-directory: frontend
        # API_URL is read at request time by the BFF routes, not baked in at
        # build time, so it does not need to be present here.
        run: npm run build

      - name: Assemble the standalone bundle
        # `output: standalone` emits server.js plus the traced node_modules,
        # but static assets and public/ are deliberately left out of it.
        working-directory: frontend
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # The startup command runs from the deployed root, so the script has
          # to be inside the bundle rather than alongside it in the repo.
          cp startup.sh .next/standalone/startup.sh
          chmod +x .next/standalone/startup.sh
          # Next copies .env into the standalone output. CI never checks one
          # out, but strip it anyway so the same commands are safe to run by
          # hand on a machine that does have real credentials in frontend/.env.
          rm -f .next/standalone/.env .next/standalone/.env.*

      - name: Fail if a secret made it into the bundle
        working-directory: frontend
        run: |
          if find .next/standalone -maxdepth 1 -name '.env*' | grep -q .; then
            echo "An .env file is in the deploy bundle — refusing to publish."
            exit 1
          fi
          echo "no .env in the bundle"

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: frontend/.next/standalone
