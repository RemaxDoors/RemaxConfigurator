# Deploys the FastAPI service (backend/) to an Azure Web App for Containers.
#
# It ships as a container rather than a code deployment because pyodbc needs
# the Microsoft ODBC driver installed at OS level, and backend/Dockerfile bakes
# msodbcsql18 in. A plain Python App Service has no reliable way to do that.
#
# Authentication is by service principal throughout — the registry's admin
# account is deliberately disabled, so there is no ACR username/password to
# use. `az acr login` mints a short-lived token from the same principal that
# deploys, which means one secret instead of four and nothing long-lived.
#
# One-time Azure setup:
#   1. Azure Container Registry (Basic is enough) — remaxconfiguratoracr.
#   2. A Linux Web App, "Publish: Container", on the existing App Service plan.
#   3. The Web App needs a system-assigned managed identity, and that identity
#      needs the AcrPull role on the registry — otherwise the deploy succeeds
#      and the app then fails to pull the image it was told to run.
#        Registry > Access control (IAM) > Add role assignment
#          > AcrPull > Managed identity > remax-configurator-api
#   4. VNet integration on the Web App (core-vnet/appservice) so it can reach
#      the M1 SQL Server. Without it the app starts, reports Running, and every
#      query times out.
#   5. Health check path: /status
#   6. Configuration > Application settings:
#        DB_SERVER, DB_NAME, DB_USER, DB_PASSWORD   (M1 SQL Server)
#        CONFIG_DB_NAME = RP_config
#        CONFIG_DB_SERVER / _USER / _PASSWORD  (only if the config DB is not
#          on the same server as M1 — e.g. Azure SQL with an on-prem M1)
#        DB_DRIVER      = ODBC Driver 18 for SQL Server   (the one in the image)
#        ALLOWED_ORIGINS= https://<your-web-app>.azurewebsites.net
#        WEBSITES_PORT  = 8000
#      Store DB_PASSWORD as a Key Vault reference, not a literal.
#
# No stored secret: authentication is OIDC federated identity, using the
# AZUREAPPSERVICE_* secrets Deployment Center created for this repository.
#   The service principal needs AcrPush on the registry (to push the image) and
#   Contributor on the Web App (to set the image it runs).
name: Deploy API to Azure

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/azure-api.yml"
  workflow_dispatch:
    inputs:
      app_name:
        description: "Azure Web App to deploy to"
        required: true
        default: remax-configurator-api

env:
  # Run it by hand and you pick the app; a push to main uses the default.
  AZURE_WEBAPP_NAME: ${{ github.event.inputs.app_name || 'remax-configurator-api' }}
  # Registry names are not secrets — keeping them here makes the image tags
  # readable in the run log, which matters when you need to roll back to one.
  ACR_NAME: remaxconfiguratoracr
  ACR_LOGIN_SERVER: remaxconfiguratoracr.azurecr.io
  IMAGE_NAME: remax-configurator-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # OIDC: azure/login exchanges a short-lived GitHub token for an Azure one,
    # so there is no client secret stored anywhere. id-token: write is what
    # lets the runner request that token.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the app imports before shipping it
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend && python -c "import app.main" && python app/formula.py

      - name: Check the Azure credentials are present
        run: |
          if [ -z "${{ secrets.AZUREAPPSERVICE_CLIENTID_BA3CC3A78F13426BB5AB97009A81433D }}" ]; then
            echo "::error::The AZUREAPPSERVICE_CLIENTID_... secret is missing."
            echo "These three secrets come from Azure Deployment Center and are"
            echo "already used by this repository. Check they still exist under"
            echo "Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Azure federated credentials are present"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA3CC3A78F13426BB5AB97009A81433D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_527ED56A30554F39BDCCDDB327FDA5A2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8010676516614B76ABB4A1684989F293 }}

      - name: Sign in to the container registry
        # Uses the Azure session above rather than admin credentials, which are
        # disabled on this registry.
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          # Pinned to the commit, not :latest — a rollback is redeploying an
          # earlier tag, with no rebuild and no ambiguity about what is running.
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke-test /status
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/status" || true)
            if [ "$code" = "200" ]; then echo "API is up"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 15
          done
          echo "API did not return 200 within 5 minutes"; exit 1
